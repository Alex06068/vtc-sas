<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · VTC-SAS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="login-page">
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-accent"></div>
      <div class="login-body">
        <div class="login-brand">
          <span class="brand-badge" aria-hidden="true">V</span>
          <span class="brand-text">
            <strong>VTC-SAS</strong>
            <small>Student Academic System</small>
          </span>
        </div>

        <h1>Sign in</h1>
        <p class="login-sub">Use your account to view your courses, assignments and attendance records.</p>

        <form id="login-form" novalidate>
          <div class="form-error" id="login-error" role="alert"></div>
          <div class="field">
            <label for="login-username">Username</label>
            <input id="login-username" name="username" type="text" autocomplete="username" required>
          </div>
          <div class="field">
            <label for="login-password">Password</label>
            <input id="login-password" name="password" type="password" autocomplete="current-password" required>
          </div>
          <button class="btn btn-primary" id="login-submit" type="submit">Sign in</button>
        </form>

        <div class="login-switch" id="register-switch">
          <form id="register-form" novalidate>
            <div class="form-error" id="register-error" role="alert"></div>
            <div class="field">
              <label for="register-username">Username</label>
              <input id="register-username" name="username" type="text" autocomplete="username" required>
            </div>
            <div class="field">
              <label for="register-email">Email</label>
              <input id="register-email" name="email" type="email" autocomplete="email" required>
            </div>
            <div class="field">
              <label for="register-password">Password</label>
              <input id="register-password" name="password" type="password" autocomplete="new-password" required>
            </div>
            <div class="field">
              <label for="register-role">Role</label>
              <select id="register-role" name="role">
                <option value="student" selected>Student</option>
                <option value="teacher">Teacher</option>
              </select>
            </div>
            <button class="btn btn-primary" id="register-submit" type="submit">Create account</button>
          </form>
        </div>

        <div class="login-foot">
          <span id="login-foot-text">No account yet? <button type="button" id="show-register">Register</button></span>
          <span id="register-foot-text">Already registered? <button type="button" id="show-login">Sign in</button></span>
        </div>
      </div>
    </div>
  </div>

  <noscript>
    <p style="text-align:center;padding:16px;color:#b3261e">JavaScript is required to sign in.</p>
  </noscript>

  <script defer src="js/config.js"></script>
  <script defer src="js/api.js"></script>
  <script defer src="js/login.js"></script>
</body>
</html>
