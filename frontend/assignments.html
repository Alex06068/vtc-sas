<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的作业 · VTC-SAS</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-navbar">
    <div class="navbar-inner container">
      <a class="brand" href="index.html" aria-label="VTC-SAS 首页">
        <span class="brand-badge" aria-hidden="true">V</span>
        <span class="brand-text">
          <strong>VTC-SAS</strong>
          <small>课程学习平台</small>
        </span>
      </a>
      <nav class="main-nav" aria-label="主导航">
        <a href="index.html">我的课程</a>
        <a href="assignments.html" class="active" aria-current="page">作业</a>
        <a href="attendance.html">出席记录</a>
      </nav>
      <div class="navbar-actions">
        <span class="user-chip" id="nav-user">
          <span class="user-role" id="nav-role"></span>
          <span id="nav-username">…</span>
        </span>
        <button class="btn btn-ghost btn-sm" id="logout-btn" type="button">退出</button>
      </div>
    </div>
  </header>

  <main class="page">
    <div class="container">
      <div class="page-head">
        <div>
          <p class="eyebrow">Dashboard · 作业</p>
          <h1>我的作业</h1>
          <p class="page-sub">按截止日期排序，显示作业名称、所属课程、截止日期与 weighting（权重）。</p>
        </div>
      </div>

      <div class="stat-chips" aria-live="polite">
        <span class="chip"><span class="dot brand" aria-hidden="true"></span>全部 <b id="task-total">0</b></span>
        <span class="chip"><span class="dot success" aria-hidden="true"></span>待完成 <b id="task-open">0</b></span>
        <span class="chip"><span class="dot danger" aria-hidden="true"></span>已截止 <b id="task-overdue">0</b></span>
      </div>

      <div class="toolbar">
        <div class="search">
          <input id="task-search" type="search" placeholder="搜索作业名称…" aria-label="搜索作业名称">
        </div>
        <select id="course-filter" aria-label="按课程筛选">
          <option value="">全部课程</option>
        </select>
      </div>

      <div class="table-card">
        <div class="table-scroll">
          <table class="data-table">
            <thead>
              <tr>
                <th scope="col">作业</th>
                <th scope="col">课程</th>
                <th scope="col">截止日期</th>
                <th scope="col">权重</th>
                <th scope="col">状态</th>
              </tr>
            </thead>
            <tbody id="tasks-body"></tbody>
          </table>
        </div>
      </div>
      <div id="tasks-status" class="state-box" role="status"></div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span>VTC-SAS · Moodle 风格课程前端</span>
      <span>数据来自后端 API · 组员 A</span>
    </div>
  </footer>

  <noscript>
    <p style="text-align:center;padding:16px;color:#b3261e">本页面需要启用 JavaScript 才能加载作业数据。</p>
  </noscript>

  <script defer src="js/config.js"></script>
  <script defer src="js/api.js"></script>
  <script defer src="js/normalize.js"></script>
  <script defer src="js/ui.js"></script>
  <script defer src="js/assignments.js"></script>
</body>
</html>
