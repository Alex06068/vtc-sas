<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>出席记录 - VTC-SAS</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f5f7fa; }
    nav { background: #1a73e8; color: white; padding: 12px 24px; display: flex; gap: 24px; }
    nav a { color: white; text-decoration: none; }
    .container { max-width: 700px; margin: 24px auto; padding: 0 16px; }
    .card { background: white; border-radius: 12px; padding: 16px; margin-bottom: 8px; }
  </style>
</head>
<body>
  <nav>
    <strong>VTC-SAS</strong>
    <a href="/">首页</a>
    <a href="/courses.html">我的课程</a>
    <a href="/assignments.html">我的作业</a>
    <a href="/attendance.html">出席</a>
    <a href="/chat.html">Chatbot</a>
  </nav>
  <div class="container">
    <h1>出席记录</h1>
    <div id="list">加载中...</div>
  </div>
  <script>
    const token = localStorage.getItem('token');
    if (!token) location.href = '/';

    async function load() {
      const res = await fetch('/api/attendance/my', {
        headers: { 'Authorization': 'Bearer ' + token }
      });
      const records = await res.json();
      const list = document.getElementById('list');
      if (!records.length) {
        list.innerHTML = '<p>暂无记录。可以在 Chatbot 说「今天签到」</p>';
        return;
      }
      list.innerHTML = records.map(r => `<div class="card">${r.date} — ${r.status}</div>`).join('');
    }
    load();
  </script>
</body>
</html>
