<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VTC-SAS Chat</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; margin: 0; background: #f5f5f5; }
    .container { max-width: 700px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; }
    header { background: #1a73e8; color: white; padding: 16px; text-align: center; font-size: 18px; font-weight: 600; }
    #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 80%; padding: 10px 14px; border-radius: 16px; line-height: 1.4; white-space: pre-wrap; }
    .user { align-self: flex-end; background: #1a73e8; color: white; border-bottom-right-radius: 4px; }
    .bot { align-self: flex-start; background: white; border: 1px solid #ddd; border-bottom-left-radius: 4px; }
    .input-area { display: flex; padding: 12px; background: white; border-top: 1px solid #ddd; gap: 8px; }
    #input { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 24px; font-size: 15px; outline: none; }
    #input:focus { border-color: #1a73e8; }
    button { padding: 0 20px; background: #1a73e8; color: white; border: none; border-radius: 24px; cursor: pointer; font-size: 15px; }
    button:disabled { background: #aaa; }
  </style>
</head>
<body>
  <div class="container">
    <header>VTC-SAS Academic Assistant</header>
    <div id="messages"></div>
    <div class="input-area">
      <input id="input" type="text" placeholder="输入消息..." autocomplete="off">
      <button id="send">发送</button>
    </div>
  </div>

  <script>
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('send');

    function addMessage(text, isUser) {
      const div = document.createElement('div');
      div.className = 'msg ' + (isUser ? 'user' : 'bot');
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text) return;

      addMessage(text, true);
      inputEl.value = '';
      sendBtn.disabled = true;

      try {
        const res = await fetch('/api/chat/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text })
        });
        const data = await res.json();
        if (res.ok) {
          addMessage(data.reply, false);
        } else {
          addMessage('错误: ' + (data.detail || '请求失败'), false);
        }
      } catch (e) {
        addMessage('网络错误: ' + e.message, false);
      }
      sendBtn.disabled = false;
      inputEl.focus();
    }

    sendBtn.addEventListener('click', sendMessage);
    inputEl.addEventListener('keydown', e => {
      if (e.key === 'Enter') sendMessage();
    });

    // 欢迎消息
    addMessage('你好！我是 VTC 学术助手，有什么可以帮你的吗？', false);
  </script>
</body>
</html>
