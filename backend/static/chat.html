<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>Chatbot - VTC-SAS</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f5f7fa; height: 100vh; display: flex; flex-direction: column; }
    nav { background: #1a73e8; color: white; padding: 12px 24px; display: flex; gap: 24px; }
    nav a { color: white; text-decoration: none; }
    #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 70%; padding: 10px 14px; border-radius: 16px; white-space: pre-wrap; }
    .user { align-self: flex-end; background: #1a73e8; color: white; }
    .bot { align-self: flex-start; background: white; border: 1px solid #ddd; }
    .input-area { display: flex; padding: 12px; background: white; gap: 8px; }
    #input { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 24px; }
    button { padding: 0 20px; background: #1a73e8; color: white; border: none; border-radius: 24px; }
  </style>
</head>
<body>
  <nav>
    <strong>VTC-SAS</strong>
    <a href="index.html">首页</a>
    <a href="courses.html">我的课程</a>
    <a href="assignments.html">我的作业</a>
    <a href="attendance.html">出席</a>
    <a href="chat.html">Chatbot</a>
  </nav>
  <div id="messages"></div>
  <div class="input-area">
    <input id="input" type="text" placeholder="输入消息..." autocomplete="off">
    <button id="send">发送</button>
  </div>

  <script>
    const token = localStorage.getItem('token');
    if (!token) location.href = 'index.html';

    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('input');

    function addMessage(text, isUser) {
      const div = document.createElement('div');
      div.className = 'msg ' + (isUser ? 'user' : 'bot');
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    addMessage('你好！我是 VTC 学术助手。你可以创建/加入课程、保存作业、查询作业或签到。', false);

    async function send() {
      const text = inputEl.value.trim();
      if (!text) return;
      addMessage(text, true);
      inputEl.value = '';
      try {
        const res = await fetch('/api/chat/', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token
          },
          body: JSON.stringify({ message: text })
        });
        const data = await res.json();
        addMessage(data.reply || '错误', false);
      } catch (e) {
        addMessage('网络错误', false);
      }
    }

    document.getElementById('send').addEventListener('click', send);
    inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
  </script>
</body>
</html>
